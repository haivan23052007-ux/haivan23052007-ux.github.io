<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex03</title>
<script language ="javascript">
    var txta =prompt ("Enter any integer");
    if (txta==null||txta ==""|| isNaN(txta))
    document.write("<font color='red'>You must enter a number</font>");
    else if (txta%2==0) // Corrected logic: Even number
    document.write("<font color='blue'><i>" + txta + " is an even number</i></font>");
    else // Corrected logic: Odd number
    document.write("<font color='green'><b>" + txta + " is an odd number </b></font>");
</script>
</head>
<body>
</body>
</html>
