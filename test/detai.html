<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chi tiết sự kiện - AURATIX</title>
<!-- Liên kết CSS nháp để đồng bộ giao diện -->
<link rel="stylesheet" href="nhap.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
/* Chỉ giữ lại các style đặc thù cho trang chi tiết */
body {
  margin: 0;
  background: var(--bg-body);
  color: #1e293b;
}

.top {
  display: flex;
  gap: 20px;
  padding: 40px 0;
  align-items: flex-start;
}

.left {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.right {
  width: 30%;
  position: sticky;
  top: 100px;
}

#calendar {
  gap: 0px;
}

.day {
  width: 26px;
  height: 26px;
  margin: 1px auto;
  font-size: 12px;
}
.model3d {
  margin: 20px auto;
  cursor: pointer;
  background: linear-gradient(180deg, #111827 0%, #0b1220 100%);
  border: 1px solid #334155;
  border-radius: 18px;
  padding: 18px;
  max-width: 640px;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
}

.preview-title {
  margin: 0 0 12px;
  font-size: 18px;
  font-weight: bold;
  color: #f8fafc;
}

.map-preview {
  width: 100%;
  height: 360px;
  background:
    radial-gradient(circle at top, rgba(59, 130, 246, 0.14), transparent 30%),
    linear-gradient(180deg, #030712 0%, #0f172a 100%);
  border-radius: 16px;
  position: relative;
  overflow: hidden;
  border: 1px solid #1e293b;
}

.preview-stage {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 300px;
  height: 60px;
  background: #222;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  border-radius: 12px;
}

.preview-map-inner {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  transform-origin: center;
}

.preview-walkway {
  position: absolute;
  top: 100px;
  left: 50%;
  transform: translateX(-50%);
  background: #1f2937;
  border-radius: 6px;
  opacity: 0.95;
}

.preview-block {
  position: absolute;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #000;
  font-size: 12px;
  font-weight: bold;
  border-radius: 10px;
  text-align: center;
  font-size: 12px;
  padding: 8px;
  box-sizing: border-box;
  white-space: pre-line;
}

.preview-block.disabled {
  opacity: 0.3;
}
.calendar-box, .schedule-list-box {
  margin-top: 20px;
  background: #fdfdfd;
  padding: 15px;
  border-radius: 10px;
  color: #000000;
}

/* HEADER */
.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.calendar-header button {
  background: #111827;
  border: none;
  color: white;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
}

.calendar-header button:hover {
  background: #ffffff;
}

#monthYear {
  font-weight: bold;
  font-size: 16px;
}

/* WEEKDAYS */
.weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  margin-bottom: 6px;
  font-size: 13px;
  color: #9ca3af;
}

/* CALENDAR GRID */
#calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px; /* khoảng cách đều như ảnh */
}

/* DAY */
.day {
  width: 100%;
  aspect-ratio: 1 / 1; /* 🔥 tạo ô vuông chuẩn */

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 12px; /* giống ảnh */
  
  /* GIỮ MÀU CŨ */
  background: #d6cfcf;
  color: #000;

  cursor: pointer;
  transition: 0.2s;
}
#calendar div {
  min-height: 30px;
}

/* HOVER */
.day:hover {
  transform: scale(1.05);
}

.day.active {
  background: #22c55e !important;
  color: white;
}

/* NGÀY CÓ EVENT */
.day.has-event {
  background: #ef4444;
  font-weight: bold;
  color: white;
}

.preview-zone {
  margin: 30px;

}

.preview-zone.curve {
  transform: perspective(600px) rotateX(20deg);
}

.preview-zone-name {
  text-align: center;
  margin-bottom: 8px;

}

.preview-row {
  display: flex;

}

.preview-seat {

  height: 26px;
  margin: 3px;
  border-radius: 4px;
}

.preview-note {
  margin-top: 15px;

.schedule-item {
  border: 1px solid #2a3240;

}

.schedule-item:hover {

}

.schedule-item.active {
  border-color: #22c55e;
  background: #111827;
}
.VIP{
  color: #f43f5e;
}
.content-wrapper {
  max-height: 120px;
  overflow: hidden;
  position: relative;
  transition: max-height 0.4s ease;
}
.content-wrapper.expanded {
  max-height: 2000px;
}
.content-fade {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 40px;
  background: linear-gradient(transparent, var(--white));
  pointer-events: none;
  transition: opacity 0.3s;
}
.content-wrapper.expanded .content-fade {
  opacity: 0;

</style>

<body>
    <header class="main-header">
        <div class="container top-bar">
            <div class="logo"><a href="index.html"><img src="https://ticketbox.vn/static/images/logo-white.png" alt="AURATIX" height="35"></a></div>
            <div class="search-box">
                <input type="text" placeholder="Bạn tìm gì hôm nay?">
                <button class="btn-search">Tìm kiếm</button>
            </div>
            <div class="header-actions">
                <div id="auth-area"></div>
            </div>
        </div>
    </header>

    <div class="container top">
      <div class="left">
        <!-- THIẾT KẾ KIỂU TẤM VÉ -->
        <div class="event-ticket-wrapper">
            <div class="ticket-banner">
                <img id="img" alt="Banner sự kiện">
            </div>
            <div class="ticket-info">
                <h1 id="title"></h1>
                <div class="ticket-detail-item">
                    <i class="fa-regular fa-calendar-check"></i>
                    <span id="date"></span>
                </div>
                <div class="ticket-detail-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <span id="location"></span>
                </div>
                <div class="ticket-price-box">
                    <span class="label">Giá vé từ</span>
                    <span id="price" class="value"></span>
                </div>
                <button class="btn-buy-ticket" onclick="goSeatmap()">MUA VÉ NGAY</button>
                <!-- Lỗ khuyết trang trí kiểu vé -->
                <div class="ticket-notch top"></div>
                <div class="ticket-notch bottom"></div>
            </div>
        </div>

        <div class="content-box">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 class="section-subtitle" style="margin: 0;">Giới thiệu sự kiện</h3>
            <button id="btnToggleContent" onclick="toggleContent()" style="background: none; border: none; color: var(--primary-teal); font-weight: bold; cursor: pointer; font-size: 14px;">Hiện thêm</button>
          </div>
          <div id="contentWrapper" class="content-wrapper">
            <p id="content" style="margin: 0; line-height: 1.6; color: var(--text-sub);"></p>
            <div class="content-fade"></div>
          </div>

          <div class="model3d" id="previewContainer" style="margin: 30px 0 0 0; max-width: 100%; cursor: pointer;" onclick="handlePreviewClick()">
            <h3 class="section-subtitle" style="margin: 0 0 15px; font-size: 18px; color: #f8fafc;">Sơ đồ chỗ ngồi</h3>
            <div class="map-preview" id="mapPreview"></div>
            <p class="preview-note">Bấm để mở sơ đồ chọn ghế chi tiết.</p>
          </div>
        </div>
        <!-- Phần lịch đã được chuyển xuống đây -->
        <div class="calendar-box">
          <div class="calendar-header">
            <button id="prevMonth">&lt;</button>
            <div id="monthYear"></div>
            <button id="nextMonth">&gt;</button>
          </div>
          <div class="weekdays">
            <div>T2</div><div>T3</div><div>T4</div><div>T5</div><div>T6</div><div>T7</div><div>CN</div>
          </div>
          <div id="calendar"></div>
        </div>
        <div class="schedule-list-box">
          <h3 class="section-subtitle">Lịch diễn</h3>
          <div id="scheduleList"></div>
        </div>
      </div>
    </div>
<script src="../event/events.js"></script>
<script src="../event/data-store.js"></script>
<script>
let database;
let eventData;
let schedules = [];
let selectedSchedule = null;
let currentDate = new Date();
let selectedSeatMap = null;

function syncSelection(schedule) {
  selectedSchedule = schedule;
  localStorage.setItem("selectedScheduleId", schedule.id);

  document.getElementById("date").innerText =
    `${EventStore.formatDate(schedule.date)} | ${schedule.time}`;
  document.getElementById("location").innerText = schedule.location;
  document.getElementById("price").innerText =
    EventStore.formatCurrency(EventStore.getLowestPrice(schedule));

  document.querySelectorAll(".schedule-item").forEach((item) => {
    item.classList.toggle("active", item.dataset.id === schedule.id);
  });

  document.querySelectorAll(".day").forEach((item) => {
    item.classList.toggle("active", item.dataset.scheduleId === schedule.id);
  });

  // Cập nhật lại preview sơ đồ khi đổi suất diễn
  renderMapPreview(selectedSeatMap);
}

function renderSchedules() {
  const container = document.getElementById("scheduleList");
  container.innerHTML = "";

  schedules.forEach((schedule) => {
    const item = document.createElement("div");
    item.className = "schedule-item";
    item.dataset.id = schedule.id;
    item.innerHTML = `
      <div><b>${EventStore.formatDate(schedule.date)}</b></div>
      <div>${schedule.time}</div>
      <div>${schedule.location}</div>
      <div>${EventStore.formatCurrency(EventStore.getLowestPrice(schedule))}</div>
    `;

    item.onclick = () => syncSelection(schedule);
    container.appendChild(item);
  });
}

function renderCalendar() {
  const calendar = document.getElementById("calendar");
  calendar.innerHTML = "";

  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  document.getElementById("monthYear").innerText = `Tháng ${month + 1}/${year}`;

 let firstDay = new Date(year, month, 1).getDay();
firstDay = (firstDay === 0) ? 6 : firstDay - 1;
  const totalDays = new Date(year, month + 1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    const spacer = document.createElement("div");
    calendar.appendChild(spacer);
  }

  for (let day = 1; day <= totalDays; day++) {
    const cell = document.createElement("div");
    cell.className = "day";
    cell.innerText = day;

    const schedule = schedules.find((item) => {
      const [yearText, monthText, dayText] = item.date.split("-");
      return Number(dayText) === day && Number(monthText) - 1 === month && Number(yearText) === year;
    });

    if (schedule) {
      cell.classList.add("has-event");
      cell.dataset.scheduleId = schedule.id;
      cell.onclick = () => syncSelection(schedule);
    }

    calendar.appendChild(cell);
  }

  if (selectedSchedule) {
    syncSelection(selectedSchedule);
  }
}

function goSeatmap() {
  if (!selectedSchedule) {
    alert("Sự kiện này chưa có lịch diễn.");
    return;
  }

  // Nếu là loại vé không cần chọn chỗ (ví dụ: festival-f - vé vào cổng)
  if (selectedSeatMap && selectedSeatMap.id === "festival-f") {
    const price = EventStore.getLowestPrice(selectedSchedule);
    const booking = {
      eventId: eventData.id,
      scheduleId: selectedSchedule.id,
      seatMapId: selectedSeatMap.id,
      seats: [{
        id: "ENTRY-1",
        label: "Vé vào cổng",
        zoneId: "ENTRY",
        zoneName: "Vé vào cổng",
        price: price,
        areaId: "ENTRY"
      }],
      total: price,
      expire: Date.now() + 5 * 60 * 1000
    };
    localStorage.setItem("booking", JSON.stringify(booking));
    window.location.href = "../event/index2.html";
    return;
  }

  window.location.href = "../event/seatmap.html";
}

function toggleContent() {
  const wrapper = document.getElementById("contentWrapper");
  const btn = document.getElementById("btnToggleContent");
  
  if (wrapper.classList.contains("expanded")) {
    wrapper.classList.remove("expanded");
    btn.innerText = "Hiện thêm";
  } else {
    wrapper.classList.add("expanded");
    btn.innerText = "Thu gọn";
  }
}

function handlePreviewClick() {
  if (!selectedSchedule) {
    alert("Sự kiện này chưa có lịch diễn.");
    return;
  }

  goSeatmap();
}

function renderMapPreview(seatMap) {
  const preview = document.getElementById("mapPreview");
  preview.innerHTML = "";

  if (!seatMap) {
    preview.innerHTML = '<div class="preview-stage">SƠ ĐỒ</div>';
    return;
  }

  if (seatMap.type === "custom-zones") {
    const canvasWidth = seatMap.canvas?.width || 1000;
    const canvasHeight = seatMap.canvas?.height || 600;
    const scale = Math.min(0.45, 600 / canvasWidth, 320 / canvasHeight);

    const inner = document.createElement("div");
    inner.className = "preview-map-inner";
    inner.style.width = `${canvasWidth}px`;
    inner.style.height = `${canvasHeight}px`;
    inner.style.transform = `translate(-50%, -50%) scale(${scale})`;

    const stage = document.createElement("div");
    stage.className = "preview-stage";
    stage.innerText = seatMap.stageLabel || "STAGE";
    inner.appendChild(stage);

    if (seatMap.walkway) {
      const walkway = document.createElement("div");
      walkway.className = "preview-walkway";
      walkway.style.width = `${seatMap.walkway.width}px`;
      walkway.style.height = `${seatMap.walkway.height}px`;
      inner.appendChild(walkway);
    }

    seatMap.sections.forEach((section) => {
      // Lấy thông tin màu sắc và tên tùy chỉnh theo schedule hiện tại
      const info = EventStore.getZoneInfo(selectedSchedule, section.id, seatMap);
      
      const block = document.createElement("div");
      block.className = `preview-block ${section.className || ""} ${section.selectable === false ? "disabled" : ""}`;
      block.style.left = `${section.x}px`;
      block.style.top = `${section.y}px`;
      block.style.width = `${section.width}px`;
      block.style.height = `${section.height}px`;
      block.style.borderRadius = section.borderRadius || "";

      // Ưu tiên: Màu từ Schedule > Màu từ Section JSON > Màu mặc định nếu trắng
      let finalColor = info.color || section.color || "";
      if (finalColor === "#ffffff" || finalColor === "white") {
          finalColor = section.color || "#14b8a6"; 
      }

      if (finalColor) block.style.backgroundColor = finalColor;

      block.style.transform = `rotate(${section.rotate || 0}deg)`;
      block.innerText = info.name;
      inner.appendChild(block);
    });

    preview.appendChild(inner);
    return;
  }

  // Sơ đồ tiêu chuẩn (Standard Grid)
  const inner = document.createElement("div");
  inner.className = "preview-map-inner";
  inner.style.width = "1000px"; // Giả định chiều rộng lớn để chứa các zone
  inner.style.textAlign = "center";
  
  const stage = document.createElement("div");
  stage.style.width = "300px";
  stage.style.height = "60px";
  stage.style.background = "#222";
  stage.style.margin = "20px auto 80px";
  stage.style.borderRadius = "12px";
  stage.style.lineHeight = "60px";
  stage.innerText = seatMap.stageLabel || "STAGE";
  inner.appendChild(stage);

  (seatMap.zones || []).forEach((zone) => {
    const info = EventStore.getZoneInfo(selectedSchedule, zone.id, seatMap);
    const zoneDiv = document.createElement("div");
    zoneDiv.className = "preview-zone curve";
    zoneDiv.innerHTML = `<div class="preview-zone-name">${info.name}</div>`;

    for (let r = 0; r < zone.rows; r++) {
      const row = document.createElement("div");
      row.className = "preview-row";
      for (let c = 0; c < zone.cols; c++) { // Sửa lỗi điều kiện vòng lặp
        const seat = document.createElement("div");
        seat.className = "preview-seat";
        seat.style.background = info.color;
        row.appendChild(seat);
      }
      zoneDiv.appendChild(row);
    }
    inner.appendChild(zoneDiv);
  });

  // Tự động tính toán scale cho phù hợp với khung 640x360
  preview.appendChild(inner);
  const scale = Math.min(0.3, 600 / inner.scrollWidth, 320 / inner.scrollHeight);
  inner.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

async function init() {
  const eventId = localStorage.getItem("selectedEventId");
  if (!eventId) {
    window.location.href = "index.html";
    return;
  }

  const cachedDb = localStorage.getItem('auratix_database_cache');
  if (!cachedDb) {
    window.location.href = "index.html";
    return;
  }
  database = JSON.parse(cachedDb);
  
  eventData = EventStore.getEventById(database, eventId);
  schedules = EventStore.getSchedulesByEventId(database, eventId);

  if (!eventData) {
    alert("Không tìm thấy sự kiện.");
    window.location.href = "index.html";
    return;
  }

  document.getElementById("title").innerText = eventData.title;
  document.getElementById("img").src = eventData.banner;
  document.getElementById("content").innerText = eventData.content;
  selectedSeatMap = EventStore.getSeatMapById(database, eventData.seatMapId);

  // Ẩn khối sơ đồ nếu là loại vé vào cổng (festival-f) hoặc không có map
  const mapPreviewBox = document.querySelector('.model3d');
  if (mapPreviewBox) {
    if (!selectedSeatMap || selectedSeatMap.id === "festival-f") {
      mapPreviewBox.style.display = 'none';
    } else {
      mapPreviewBox.style.display = 'block';
    }
  }

  renderSchedules();

  const savedScheduleId = localStorage.getItem("selectedScheduleId");
  const savedSchedule = EventStore.getScheduleById(database, savedScheduleId);
  selectedSchedule =
    (savedSchedule && savedSchedule.eventId === eventData.id ? savedSchedule : null) ||
    schedules[0] ||
    null;

  if (selectedSchedule) {
    const [year, month] = selectedSchedule.date.split("-");
    currentDate = new Date(Number(year), Number(month) - 1, 1);
    syncSelection(selectedSchedule);
  } else {
    document.getElementById("date").innerText = "Chưa có lịch diễn";
    document.getElementById("location").innerText = eventData.venue;
    document.getElementById("price").innerText = "Đang cập nhật";
  }

  renderMapPreview(selectedSeatMap);
  renderCalendar();

// Khởi tạo Auth UI (từ nhap.js nếu có nhúng)
if (typeof renderAuthArea === 'function') {
    renderAuthArea();
}

}

init().catch((error) => {
  document.body.innerHTML = `<p>Không tải được dữ liệu: ${error.message}</p>`;
});
document.getElementById("prevMonth").onclick = () => {
  currentDate.setMonth(currentDate.getMonth() - 1);
  renderCalendar();
};

document.getElementById("nextMonth").onclick = () => {
  currentDate.setMonth(currentDate.getMonth() + 1);
  renderCalendar();
};
</script>
<script src="nhap.js"></script>
